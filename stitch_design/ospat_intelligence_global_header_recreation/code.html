<!DOCTYPE html><html lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>OSPAT Intelligence Header</title>
<!-- Include Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Manrope -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<!-- Phosphor Icons -->
<script src="https://unpkg.com/@phosphor-icons/web"></script><link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css"><link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/thin/style.css"><link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/light/style.css"><link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/bold/style.css"><link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/fill/style.css"><link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/duotone/style.css">
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Manrope', 'sans-serif'],
          },
          colors: {
            primary: {
              DEFAULT: '#0d4e5c',
              light: '#14768c',
              dark: '#08313a',
            },
            surface: '#fcf8fb',
            surfaceDim: '#dcd9dc',
            surfaceContainerLow: '#f6f3f5',
            outlineVariant: '#cac4c8',
            onSurfaceVariant: '#484649',
          },
          borderRadius: {
            'xl': '8px',
          }
        }
      }
    }
  </script>
<style data-purpose="custom-utilities">
    /* Custom utility classes if needed */
    .active-nav-link {
      border-bottom: 2px solid theme('colors.primary.DEFAULT');
      color: theme('colors.primary.DEFAULT');
      font-weight: 600;
    }
  </style>
</head>
<body class="bg-surface font-sans text-onSurfaceVariant antialiased">
<!-- BEGIN: HeaderSection -->
<header class="bg-white border-b border-outlineVariant shadow-sm">
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
<div class="flex justify-between h-16 items-center">
<!-- BEGIN: BrandLogo -->
<div class="flex-shrink-0 flex items-center">
<a class="text-xl font-bold text-primary tracking-tight" href="#">
            OSPAT Intelligence
          </a>
</div>
<!-- END: BrandLogo -->
<!-- BEGIN: MainNavigation -->
<nav class="hidden md:flex space-x-8">
<a class="text-onSurfaceVariant hover:text-primary transition-colors duration-200 px-1 py-5 text-sm font-medium border-b-2 border-transparent hover:border-primary" href="#">
            Insurance
          </a>
<a class="text-onSurfaceVariant hover:text-primary transition-colors duration-200 px-1 py-5 text-sm font-medium border-b-2 border-transparent hover:border-primary" href="#">
            Hospitals
          </a>
<a class="text-onSurfaceVariant hover:text-primary transition-colors duration-200 px-1 py-5 text-sm font-medium border-b-2 border-transparent hover:border-primary" href="#">
            Care Journey
          </a>
</nav>
<!-- END: MainNavigation -->
<!-- BEGIN: ActionButtons -->
<div class="flex items-center space-x-4">
<!-- Divider -->
<div class="hidden sm:block h-6 w-px bg-outlineVariant mx-2"></div>
<button class="inline-flex items-center px-4 py-2 border border-outlineVariant shadow-sm text-sm font-medium rounded-full text-primary bg-white hover:bg-surfaceContainerLow focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors duration-200" type="button">
            Get Help
          </button>
<button aria-label="User Profile" class="flex items-center justify-center h-10 w-10 rounded-full bg-primary text-white hover:bg-primary-light focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors duration-200" type="button">
<i class="ph ph-user text-xl"></i>
</button>
</div>
<!-- END: ActionButtons -->
</div>
</div>
</header>
<!-- END: HeaderSection -->
<!-- BEGIN: MainContentPlaceholder -->
<main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
<div class="px-4 py-6 sm:px-0">
<div class="border-4 border-dashed border-outlineVariant rounded-xl h-96 flex items-center justify-center text-onSurfaceVariant">
        Content Area
      </div>
</div>
</main>
