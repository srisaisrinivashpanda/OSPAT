server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: hospitality-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/hospitality_db?options=-c%20timezone%3DUTC}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-init-sql: SET timezone = 'UTC'
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

# AI & Multi-Provider Configuration (Gemini, Ollama, Heuristic)
hospitality:
  ai:
    provider: ${AI_PROVIDER:gemini} # gemini, ollama, or heuristic
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-2.5-flash}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
      connect-timeout-ms: ${GEMINI_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${GEMINI_READ_TIMEOUT_MS:20000}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: ${OLLAMA_MODEL:qwen2.5:7b}
      connect-timeout-ms: 3000
      read-timeout-ms: 15000
  matching:
    weights:
      network: 0.40
      room: 0.30
      availability: 0.20
      constraints: 0.10

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
