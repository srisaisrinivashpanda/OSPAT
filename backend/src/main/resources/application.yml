server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: hospitality-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/hospitality_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:300000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1200000}
      connection-timeout: ${DB_POOL_CONNECT_TIMEOUT_MS:20000}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

# AI, CORS, & Matching Configuration
hospitality:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000}
  ai:
    provider: ${AI_PROVIDER:gemini} # gemini, ollama, or heuristic
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-2.5-flash}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
      connect-timeout-ms: ${GEMINI_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${GEMINI_READ_TIMEOUT_MS:20000}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: ${OLLAMA_MODEL:qwen2.5:7b}
      connect-timeout-ms: 3000
      read-timeout-ms: 15000
  matching:
    weights:
      network: 0.40
      room: 0.30
      availability: 0.20
      constraints: 0.10

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

